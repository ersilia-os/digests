title: Ersilia Digests
description: Periodic digests of relevance to the Ersilia Open Source Initiative
baseurl: /digests

# Without this, kramdown's default (non-GFM) input mode "smart"-typographies the
# `---` in a table's header-separator row into a single em dash before the table
# parser ever sees it, silently breaking every pipe table (event-discovery's
# report tables rendered as raw "| a | b |" text until this was set).
markdown: kramdown
kramdown:
  input: GFM

# Render the digest Markdown with our layout without touching the source files.
# (The digests are copied into ./literature, ./github, and ./events at build time — see .github/workflows/pages.yml)
defaults:
  - scope:
      path: "literature"
    values:
      layout: digest
  - scope:
      path: "github"
    values:
      layout: digest
  - scope:
      path: "events"
    values:
      layout: digest
      # Event reports are table-first documents: they get the wide column so the
      # header block, headings and bullet lists line up with their tables instead of
      # stopping at the 720px prose width. Opt-in per family on purpose — literature
      # and github digests have no tables, and widening prose to 1100px only makes
      # the line length worse. A future family that emits tables adds `wide: true`.
      wide: true

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
