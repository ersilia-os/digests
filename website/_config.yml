title: Ersilia Digests
description: Periodic digests of relevance to the Ersilia Open Source Initiative
url: https://ersilia-os.github.io
baseurl: /digests

# Without this, kramdown's default (non-GFM) input mode "smart"-typographies the
# `---` in a table's header-separator row into a single em dash before the table
# parser ever sees it, silently breaking every pipe table (event-discovery's
# report tables rendered as raw "| a | b |" text until this was set).
markdown: kramdown
kramdown:
  input: GFM

# Render the digest Markdown with our layout without touching the source files.
# (The digests are copied into ./literature, ./github, ./events and ./models at build time — see .github/workflows/pages.yml)
defaults:
  - scope:
      path: "literature"
    values:
      layout: digest
      family: literature
      family_name: Literature digest
      description: "Weekly scan of new models, datasets and papers for the Ersilia Model Hub, with a focus on antimicrobial drug discovery and global health."
  - scope:
      path: "github"
    values:
      layout: digest
      family: github
      family_name: GitHub digest
      description: "Issue and pull-request activity across the ersilia-os open-source repositories, and what needs attention."
  - scope:
      path: "models"
    values:
      layout: digest
      # One row per model, so it takes the wide column for the same reason the event
      # reports do.
      wide: true
      family: models
      family_name: Model incorporation digest
      description: "Every model incorporated into the Ersilia Model Hub this month, crediting the original authors."
  - scope:
      path: "events"
    values:
      layout: digest
      family: events
      family_name: Event digest
      description: "Conferences, workshops and calls relevant to open-source AI for global-health drug discovery."
      # Event reports are table-first documents: they get the wide column so the
      # header block, headings and bullet lists line up with their tables instead of
      # stopping at the 720px prose width. Opt-in per family on purpose — literature
      # and github digests have no tables, and widening prose to 1100px only makes
      # the line length worse. A future family that emits tables adds `wide: true`.
      wide: true

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
