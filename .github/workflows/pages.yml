name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let in-progress runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The digests live at the repo root; stage them into the Jekyll source
      # so the repository root stays clean.
      - name: Stage digests into the site source
        run: |
          cp -r literature website/literature
          cp -r github website/github
          if [ -d events ]; then cp -r events website/events; fi
          if [ -d models ]; then cp -r models website/models; fi

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: website

      - name: Build with Jekyll
        working-directory: website
        run: bundle exec jekyll build --destination "${{ github.workspace }}/_site"
        env:
          JEKYLL_ENV: production

      # Social preview cards (LinkedIn / Slack / X): screenshot the top of every built
      # page into _site/og/<page>.png, the path og:image points at in
      # website/_includes/social-meta.html. Uses the runner's preinstalled Chrome.
      - name: Generate social preview images
        run: |
          # Digest headers use emoji markers; without a colour emoji font they render as boxes.
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-noto-color-emoji >/dev/null
          python3 scripts/make_og_images.py "${{ github.workspace }}/_site" --baseurl /digests

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
